name: probe-pages
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to render and record"
        required: true
permissions:
  contents: write
concurrency: radar-data
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m radar.probe ${{ inputs.urls }}
      - name: Commit
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 5; done
